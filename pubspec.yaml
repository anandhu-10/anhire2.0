name: placementprep
description: "AI Placement Preparation Platform"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.0

dependencies:
  cloud_firestore: ^6.8.0
  file_picker: ^10.3.3
  firebase_auth: ^6.5.7
  firebase_core: ^4.13.0
  fl_chart: ^0.70.2
  flutter:
    sdk: flutter
  flutter_dotenv: ^5.2.1
  flutter_riverpod: ^3.4.2
  go_router: ^17.5.0
  google_fonts: ^6.2.1
  google_generative_ai: ^0.4.6
  google_sign_in: ^7.2.0
  http: ^1.2.2
  riverpod_annotation: ^4.0.6
  shimmer: ^3.0.0
  syncfusion_flutter_pdf: ^30.2.7

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - .env
